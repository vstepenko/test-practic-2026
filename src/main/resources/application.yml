spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/test?currentSchema=testpractic
    username: postgres
    password: 12345678
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:liquibase/db.changelog-master.xml
    default-schema: testpractic

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: testpractic
    open-in-view: false

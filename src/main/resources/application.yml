spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/test?currentSchema=testpractic
    username: postgres
    password: 123456789
    driver-class-name: org.postgresql.Driver
    hikari:
      # Liquibase не створює default-schema сам, тому створюємо її при підключенні.
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS testpractic

  liquibase:
    change-log: classpath:liquibase/db.changelog-master.xml
    default-schema: testpractic

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: testpractic
    open-in-view: false

# H2 ? ???'??? ??????? PostgreSQL. MODE=PostgreSQL ???????? SQL-??????? ?? ?????????.
spring.datasource.url=jdbc:h2:mem:testlec;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER;INIT=CREATE SCHEMA IF NOT EXISTS testpractic
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# The global spring.config.import env var pulls in D:\BE\config\application.properties,
# which points spring.liquibase.url at PostgreSQL. Point Liquibase back at H2.
spring.liquibase.url=${spring.datasource.url}
spring.liquibase.user=sa
spring.liquibase.password=
spring.liquibase.contexts=

